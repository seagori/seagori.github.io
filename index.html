<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SEAGORI - Personal Portal & Hub">
  <meta name="theme-color" content="#fcf8e8">
  <title>SEAGORI</title>

  <style>
    /* -------------------------------------------------------------
       Inspired by Zed's "Paper - Contrast"
       ------------------------------------------------------------- */
    :root {
      --bg-color: #fcf8e8;
      --card-bg: #ffffff;
      --card-hover-bg: #fdfcf7;
      --border-color: #e5e0cf;
      --border-hover: #0fbda8;
      --text-main: #3e3d39;
      --text-muted: #676664;
      --text-sub: #898883;
      --accent: #007aa3;
      --accent-teal: #0fbda8;
      --icon-bg: #f6f1e2;
      --tag-bg: #f2ede0;
      --radius: 14px;
      --shadow-sm: 0 1px 2px rgba(62, 61, 57, 0.04);
      --shadow-hover: 0 6px 16px rgba(62, 61, 57, 0.08);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3.5rem 1.25rem 2rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle parchment depth */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 700px at 50% 15%, rgba(255, 255, 255, 0.5), transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* -------------------------------------------------------------
       Layout Container
       ------------------------------------------------------------- */
    .container {
      width: 100%;
      max-width: 960px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* -------------------------------------------------------------
       Header Section
       ------------------------------------------------------------- */
    header {
      text-align: center;
      margin-bottom: 2.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 0.45rem;
    }

    .bio {
      font-size: 0.925rem;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.5;
      text-wrap: balance;
    }

    /* -------------------------------------------------------------
       Modern Responsive Grid
       ------------------------------------------------------------- */
    .grid-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.125rem;
    }

    /* -------------------------------------------------------------
       Link Card Style
       ------------------------------------------------------------- */
    .card {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.35rem 1.45rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 145px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      outline: none;
    }

    .card:hover {
      background-color: var(--card-hover-bg);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(15, 189, 168, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }

    .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--icon-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .icon-box svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .card:hover .icon-box {
      color: var(--accent);
      background-color: rgba(15, 189, 168, 0.08);
      border-color: rgba(15, 189, 168, 0.25);
    }

    .card-tag {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background-color: var(--tag-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      transition: color 0.15s ease;
    }

    /* Individual Card Accents */
    .card-blog .card-tag {
      color: #007aa3;
      background-color: rgba(0, 122, 163, 0.08);
      border-color: rgba(0, 122, 163, 0.16);
    }
    .card-github .card-tag {
      color: #2059cb;
      background-color: rgba(32, 89, 203, 0.08);
      border-color: rgba(32, 89, 203, 0.16);
    }
    .card-bsky .card-tag {
      color: #0fbda8;
      background-color: rgba(15, 189, 168, 0.1);
      border-color: rgba(15, 189, 168, 0.2);
    }

    .card-body h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
      transition: color 0.15s ease;
    }

    .card:hover .card-body h2 {
      color: var(--accent);
    }

    .arrow-icon {
      width: 14px;
      height: 14px;
      color: var(--text-sub);
      transition: transform 0.2s ease, color 0.15s ease;
    }

    .card:hover .arrow-icon {
      transform: translate(2px, -2px);
      color: var(--accent);
    }

    .card-body p {
      font-size: 0.825rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 0.85rem;
    }

    .card-domain {
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-sub);
    }

    /* -------------------------------------------------------------
       Footer
       ------------------------------------------------------------- */
    footer {
      margin-top: 3.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      position: relative;
      z-index: 1;
    }

    /* -------------------------------------------------------------
       Mobile Adjustments
       ------------------------------------------------------------- */
    @media (max-width: 640px) {
      body {
        padding: 2.5rem 1rem 1.5rem;
      }
      header {
        margin-bottom: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .grid-container {
        grid-template-columns: 1fr;
        gap: 0.875rem;
      }
      .card {
        min-height: auto;
        padding: 1.15rem 1.2rem;
      }
    }
  </style>
</head>
